# Project sandbox for Codex. Loaded only when the project is trusted.
# The permission-profile system is beta — after a Codex update, re-run the
# escape checks from the set-up-sandbox skill before trusting this config.

default_permissions = "project-locked"
approval_policy = "never"

[features]
# The proxy stays on even though every domain is allowed below. Turning it
# off would make the domain rules silently stop enforcing, so a later
# tightening of that list would look applied without being applied.
network_proxy = true

[permissions.project-locked.filesystem]
":minimal" = "read"

[permissions.project-locked.filesystem.":workspace_roots"]
"." = "write"
"**/*.env" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"

[permissions.project-locked.network]
enabled = true

[permissions.project-locked.network.domains]
# Egress is open by default: the repository is the blast radius, and the
# allowlist was never a real exfiltration boundary anyway. To tighten,
# replace this line with one "allow" line per domain the stack needs
# and add a final '"*" = "deny"'.
"*" = "allow"
