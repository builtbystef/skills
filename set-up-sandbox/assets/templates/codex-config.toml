# Project sandbox for Codex. Loaded only when the project is trusted.
#
# Verified against codex-cli 0.148.0 on 2026-08-20 by running the skill's
# escape probes. Two findings shape this file:
#
# 1. Codex confines WRITES and command execution. It does not confine READS.
#    No sandbox mode restricts reading files outside the workspace — the
#    docs describe workspace-write as "read files, edit within the
#    workspace". A probe under this config read a file from $HOME.
# 2. The beta permission-profile block (default_permissions plus
#    [permissions.<name>.filesystem]) that would have confined reads is
#    accepted by --strict-config and then ignored. It is not generated here,
#    because config that looks like a boundary and is not is worse than none.
#
# Re-check both after every Codex upgrade with `codex exec --strict-config`
# and the probes. If a released permission profile gains read confinement,
# this file should adopt it.

sandbox_mode = "workspace-write"
approval_policy = "never"

[sandbox_workspace_write]
# Egress is open: the repository is the blast radius either way, and Codex
# offers no read boundary to protect. Set to false to cut network access.
network_access = true
