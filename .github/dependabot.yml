version: 2
updates:
  # Watches set-up-sandbox/package.json, which mirrors the pinned Pi
  # extension versions. A PR = a new release to review, not an auto-update.
  - package-ecosystem: "npm"
    directory: "/set-up-sandbox"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    open-pull-requests-limit: 2
    labels:
      - "pi-extension-release"
